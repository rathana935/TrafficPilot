
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrafficPilot Task</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101426;
      color: #f4f6ff;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 16px;
      background: #1a2038;
      border-bottom: 1px solid #343b59;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    #timer {
      font-size: 34px;
      font-weight: bold;
      color: #a99cff;
    }
    #message { color: #c5cbe0; line-height: 1.5; }
    #siteFrame {
      display: block;
      width: 100%;
      height: 65vh;
      min-height: 400px;
      border: 0;
      background: white;
    }
    #verification {
      padding: 18px;
      border-top: 1px solid #343b59;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 16px;
    }
    input {
      background: #101426;
      color: white;
      border: 1px solid #505a7d;
    }
    button {
      border: 0;
      background: #8170ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    #captcha, #keywordBox { display: none; }
    .note { color: #c5cbe0; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>🚦 TrafficPilot Task</h1>
    <div>Time remaining: <span id="timer">--:--</span></div>
    <p id="message">Loading task...</p>
  </header>

  <iframe id="siteFrame" title="Advertiser website"
          referrerpolicy="no-referrer"></iframe>

  <section id="verification">
    <p id="frameNote" class="note">
      Complete your visit on the advertiser's website while the timer runs.
    </p>

    <section id="captcha">
      <h2>Human verification</h2>
      <p id="question"></p>
      <input id="answer" inputmode="numeric"
             autocomplete="off" placeholder="Enter your answer">
      <button id="verifyBtn">Verify answer</button>
    </section>

    <section id="keywordBox">
      <h2>✅ Verification complete</h2>
      <p>Your task keyword:</p>
      <input id="keyword" readonly>
      <button id="copyBtn">Copy keyword</button>
      <p class="note">
        Return to Telegram and submit the keyword with your task proof.
      </p>
    </section>
  </section>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const campaignId = params.get("campaign");
  const token = params.get("token");
  const campaignUrl = params.get("url");

  const timer = document.getElementById("timer");
  const message = document.getElementById("message");
  const captcha = document.getElementById("captcha");
  const keywordBox = document.getElementById("keywordBox");
  const frame = document.getElementById("siteFrame");

  let interval = null;
  let startedAt = 0;
  let waitSeconds = 60;
  let captchaRequested = false;

  function say(text) {
    message.textContent = text;
  }

  function showTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    timer.textContent =
      String(m).padStart(2, "0") + ":" +
      String(s).padStart(2, "0");
  }

  async function api(path, body = {}) {
    const response = await fetch("/api/task/" + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ campaignId, token, ...body })
    });

    const data = await response.json();
    if (!response.ok) {
      throw new Error(data.error || "Request failed");
    }
    return data;
  }

  async function requestCaptcha() {
    if (captchaRequested) return;
    captchaRequested = true;
    clearInterval(interval);

    try {
      const data = await api("captcha");
      document.getElementById("question").textContent =
        "Solve: " + data.question + " = ?";
      captcha.style.display = "block";
      say("Timer completed. Solve the question to receive your keyword.");
    } catch (e) {
      captchaRequested = false;
      say(e.message);
    }
  }

  function tick() {
    const elapsed = Math.floor((Date.now() - startedAt) / 1000);
    const remaining = Math.max(0, waitSeconds - elapsed);
    showTime(remaining);

    if (remaining === 0) {
      requestCaptcha();
    }
  }

  async function startTask() {
    try {
      say("Starting your task timer...");

      // The server validates the task token and supplies the duration.
      const data = await api("start");
      startedAt = Number(data.startedAt);
      waitSeconds = Number(data.waitSeconds);

      if (
        !Number.isFinite(startedAt) ||
        !Number.isFinite(waitSeconds) ||
        waitSeconds < 1
      ) {
        throw new Error("Invalid timer information from the server.");
      }

      say("Your task timer is running.");
      tick();
      if (waitSeconds > 0) {
        interval = setInterval(tick, 1000);
      }
    } catch (e) {
      say(e.message);
      timer.textContent = "--:--";
    }
  }

  document.getElementById("verifyBtn").addEventListener("click", async () => {
    const answer = document.getElementById("answer").value.trim();
    const button = document.getElementById("verifyBtn");
    button.disabled = true;

    try {
      const data = await api("verify", { answer });
      captcha.style.display = "none";
      keywordBox.style.display = "block";
      document.getElementById("keyword").value = data.keyword;
      say("Keyword generated. Return to Telegram to submit your proof.");
    } catch (e) {
      say(e.message);
    } finally {
      button.disabled = false;
    }
  });

  document.getElementById("copyBtn").addEventListener("click", async () => {
    const value = document.getElementById("keyword").value;

    try {
      await navigator.clipboard.writeText(value);
      say("Keyword copied.");
    } catch {
      document.getElementById("keyword").select();
      say("Select and copy the keyword manually.");
    }
  });

  if (!campaignId || !token || !campaignUrl) {
    say("Invalid task link. Open the task using the TrafficPilot bot.");
    frame.style.display = "none";
    return;
  }

  let parsedUrl;
  try {
    parsedUrl = new URL(campaignUrl);
    if (!["http:", "https:"].includes(parsedUrl.protocol)) {
      throw new Error("Unsupported website protocol.");
    }
  } catch {
    say("The campaign website URL is invalid.");
    frame.style.display = "none";
    return;
  }

  frame.src = parsedUrl.href;
  startTask();
})();
</script>
</body>
</html>
