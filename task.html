
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrafficPilot Task Verification</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #101426;
      color: #f4f6ff;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 440px;
      padding: 26px;
      border: 1px solid #343b59;
      border-radius: 18px;
      background: #1a2038;
    }
    h1 { margin-top: 0; font-size: 25px; }
    p { color: #c5cbe0; line-height: 1.6; }
    #timer {
      margin: 22px 0;
      font-size: 48px;
      font-weight: bold;
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 9px;
      font-size: 16px;
    }
    input {
      border: 1px solid #505a7d;
      background: #101426;
      color: white;
    }
    button {
      border: 0;
      background: #8170ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #captcha, #keywordBox { display: none; }
    #message { overflow-wrap: anywhere; }
    .note { font-size: 13px; }
  </style>
</head>
<body>
<main>
  <h1>🚦 TrafficPilot</h1>
  <p id="intro">Verifying your task. Please wait.</p>

  <div id="timer">01:00</div>

  <button id="startBtn">Start task timer</button>

  <section id="captcha">
    <h2>Human verification</h2>
    <p id="question"></p>
    <input id="answer" inputmode="numeric"
           autocomplete="off" placeholder="Enter your answer">
    <button id="verifyBtn">Verify answer</button>
  </section>

  <section id="keywordBox">
    <h2>✅ Verification complete</h2>
    <p>Your task keyword:</p>
    <input id="keyword" readonly>
    <button id="copyBtn">Copy keyword</button>
    <p class="note">Return to Telegram and submit this keyword with your task proof.</p>
  </section>

  <p id="message" role="status"></p>
</main>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const campaignId = params.get("campaign");
  const token = params.get("token");

  const timer = document.getElementById("timer");
  const startBtn = document.getElementById("startBtn");
  const captcha = document.getElementById("captcha");
  const keywordBox = document.getElementById("keywordBox");
  const message = document.getElementById("message");

  let interval = null;
  let startedAt = 0;
  let waitSeconds = 60;

  function say(text) {
    message.textContent = text;
  }

  function showTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    timer.textContent =
      String(m).padStart(2, "0") + ":" +
      String(s).padStart(2, "0");
  }

  async function api(path, body = {}) {
    const response = await fetch("/api/task/" + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ campaignId, token, ...body })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Request failed");
    return data;
  }

  startBtn.addEventListener("click", async () => {
    startBtn.disabled = true;
    say("Starting secure timer...");
    try {
      const data = await api("start");
      startedAt = data.startedAt;
      waitSeconds = data.waitSeconds;
      startBtn.style.display = "none";
      say("Keep this page open while completing the task.");
      tick();
      interval = setInterval(tick, 1000);
    } catch (e) {
      startBtn.disabled = false;
      say(e.message);
    }
  });

  function tick() {
    const elapsed = Math.floor((Date.now() - startedAt) / 1000);
    const remaining = Math.max(0, waitSeconds - elapsed);
    showTime(remaining);
    if (remaining === 0) {
      clearInterval(interval);
      interval = null;
      requestCaptcha();
    }
  }

  async function requestCaptcha() {
    try {
      const data = await api("captcha");
      document.getElementById("question").textContent =
        "Solve: " + data.question + " = ?";
      captcha.style.display = "block";
      say("Timer completed. Solve the question to receive your keyword.");
    } catch (e) {
      say(e.message);
    }
  }

  document.getElementById("verifyBtn").addEventListener("click", async () => {
    const answer = document.getElementById("answer").value.trim();
    const button = document.getElementById("verifyBtn");
    button.disabled = true;
    try {
      const data = await api("verify", { answer });
      captcha.style.display = "none";
      keywordBox.style.display = "block";
      document.getElementById("keyword").value = data.keyword;
      say("Keyword generated. Return to Telegram to submit your proof.");
    } catch (e) {
      say(e.message);
    } finally {
      button.disabled = false;
    }
  });

  document.getElementById("copyBtn").addEventListener("click", async () => {
    const value = document.getElementById("keyword").value;
    try {
      await navigator.clipboard.writeText(value);
      say("Keyword copied.");
    } catch {
      document.getElementById("keyword").select();
      say("Select and copy the keyword manually.");
    }
  });

  if (!campaignId || !token) {
    startBtn.disabled = true;
    say("Invalid task link. Please open this page from TrafficPilot.");
  } else {
    showTime(60);
    // Timer starts only after the user clicks Start.
  }
})();
</script>
</body>
</html>
